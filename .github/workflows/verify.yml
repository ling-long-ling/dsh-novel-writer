# Keep the plugin honest: every push/PR runs the same 17 static checks the
# maintainer runs locally. The optional DSH Desktop checks print SKIP when the
# app is not installed, so the suite still works on a bare CI runner.
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the full check suite
        run: node scripts/verify.mjs
